/**
 * Quan X 重写配置
 * Gemini 节点检测器
 * 
 * 使用方法:
 * 1. 在 Quan X 配置中添加此重写
 * 2. 通过 Shortcuts 或手动运行脚本
 * 3. 配置策略组名称（默认为 Proxy）
 */

[rewrite_local]
# 当前节点检测
^https?:\/\/gemini-check\.local\/current url script-request-header https://raw.githubusercontent.com/5jwoj/Surge/main/gemini-checker-v2/gemini-checker.js

# 批量节点检测
^https?:\/\/gemini-check\.local\/all url script-request-header https://raw.githubusercontent.com/5jwoj/Surge/main/gemini-checker-v2/gemini-checker.js

[task_local]
# 定时检测（每天早上 9 点）
0 9 * * * https://raw.githubusercontent.com/5jwoj/Surge/main/gemini-checker-v2/gemini-checker.js, tag=Gemini节点检测, enabled=false

[mitm]
# 不需要 MITM
